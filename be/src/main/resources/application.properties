# I segreti (password DB e chiave JWT) stanno in env.properties, che NON va committato.
spring.config.import=file:env.properties

spring.application.name=demo
server.port=3001

# --- Database ---
spring.datasource.url=jdbc:postgresql://localhost:5432/U7W1D2
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET}

# ============================================================
#  INTERRUTTORI DELLE VULNERABILITA'
# ============================================================
# Ogni flag accende la versione VULNERABILE di un pezzo di codice.
# La versione sicura e' scritta accanto, nello stesso metodo: si confrontano a colpo d'occhio.
#
#   true  -> l'app e' il bersaglio: gli agenti devono TROVARE il problema
#   false -> l'app e' corretta:     gli agenti devono passare puliti
#
# Questo e' il cuore dell'esercizio: si lanciano gli agenti con i flag a true (fase "attacco"),
# poi si rimettono a false (fase "difesa") e si verifica che i report diventino verdi.
app.vulnerable.sqli=true
app.vulnerable.xss=true
app.vulnerable.csrf=true
# LIVELLO 3 (D2): accesso al singolo dato ristretto per proprietario. true = IDOR aperto.
app.vulnerable.idor=true

# Cartella dove gli agenti scrivono i loro report
app.audit.output-dir=../reports
